; Godot export presets for Dungeon Dudes playtest builds (task 051).
; Shared contract (CLAUDE.md "Shared contracts": build config). Change it only in a small PR that
; contains nothing else, approved by the other person. Lane of the build script: tools (Agent B).
;
; Used by tools/build.sh, which runs `godot --headless --export-release "<name>" <export_path>` for
; each preset below. Godot fills every option not written here with its own default for the pinned
; version (tools/install_godot.sh), so only the options that matter to us are listed.
;
; Comments: Godot's ConfigFile reader skips lines starting with ";". Godot's editor drops them if
; it re-saves this file (Project > Export), so after editing presets in the editor, put the
; comments back by hand before committing.
;
; Keys used in every [preset.N] section (Godot's own format):
;   name             The preset's name. tools/build.sh passes it to --export-release, so renaming a
;                    preset means changing tools/build.sh in the same PR.
;   platform         Godot's export platform: "Windows Desktop", "macOS" or "Linux".
;   runnable         true marks the preset Godot runs for one-click deploy. One per platform.
;   dedicated_server false: a normal game build with rendering, not a headless server build.
;   custom_features  Extra feature tags for OS.has_feature(). Empty: none.
;   export_filter    "all_resources": export every resource in the project, then apply the filters.
;   include_filter   Comma-separated globs of non-resource files to add. Empty: none needed; the
;                    data/*.json files are resources to Godot 4 and export without being listed.
;   exclude_filter   Comma-separated globs (matched against the path with and without "res://") of
;                    files to leave out of the game. Same list in all three presets:
;                      tests/*                    the test suite (tests/ lanes of both agents)
;                      docs/*                     design docs, task board, change logs
;                      .github/*                  CI config
;                      tools/*.sh                 install, test and build scripts
;                      tools/*/*                  any tools/ subfolder (bot players, simulation)
;                      assets/placeholder/source/*  the uncut art sheet and its slicing script
;                    tools/data_files.gd is deliberately NOT excluded: client/run/run_screen.gd and
;                    client/dev/dev_fight.gd preload it to read data/ at runtime, and the game
;                    fails to start without it (tools/build.sh --check catches that). So "tools/*"
;                    cannot be excluded as a whole; a new script placed directly in tools/ is
;                    exported unless it is added here, so put tools-only scripts in a subfolder.
;                    Godot exports only resources (scripts, scenes, images, .json, ...), never
;                    .md, .sh, .py or .yml files, so docs/*, .github/* and tools/*.sh exclude
;                    nothing today; they are listed so nothing there ever ships by accident.
;   export_path      Where the build is written, relative to the repository root. build/ is
;                    git-ignored; tools/build.sh creates each folder.
;   encrypt_pck, encrypt_directory  false: no encryption (no key to manage for playtests).
;   script_export_mode  2: scripts are exported as compressed binary tokens (Godot 4 default).
;
; Keys used in [preset.N.options] are per platform and are described above each one.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, .github/*, tools/*.sh, tools/*/*, assets/placeholder/source/*"
export_path="build/windows/DungeonDudes.exe"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; binary_format/architecture: CPU the Windows build runs on. "x86_64" covers almost every PC.
binary_format/architecture="x86_64"
; binary_format/embed_pck: false keeps the game data in DungeonDudes.pck next to the .exe.
binary_format/embed_pck=false
; codesign/enable: false. Windows builds are not signed; SmartScreen may warn (tools/README.md).
codesign/enable=false
; application/product_name, application/file_description: shown in the .exe's Properties.
application/product_name="Dungeon Dudes"
application/file_description="Dungeon Dudes playtest build"
; debug/export_console_wrapper: 1 = only debug exports get a console .exe; build.sh exports release.
debug/export_console_wrapper=1

[preset.1]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, .github/*, tools/*.sh, tools/*/*, assets/placeholder/source/*"
export_path="build/macos/DungeonDudes.zip"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

; binary_format/architecture: "universal" runs natively on Intel and Apple Silicon Macs. It is the
; only choice the official templates ship (they hold no x86_64-only or arm64-only macOS binary).
; Godot refuses it until project.godot sets rendering/textures/vram_compression/import_etc2_astc
; to true; until that one-line project.godot PR merges, the macOS export fails (task 051 log).
binary_format/architecture="universal"
; application/bundle_identifier: macOS app id, reverse-DNS. Required by Godot; never shown to players.
; Saves do not depend on it (user:// uses the project name, see tools/README.md).
application/bundle_identifier="io.github.smoketsu.dungeondudes"
; application/app_category: the App Store category, "Games".
application/app_category="Games"
; codesign/codesign: 1 = Godot's built-in ad-hoc signature. Apple Silicon refuses to run a binary
; with no signature at all; ad-hoc is not an Apple Developer ID, so testers still have to allow the
; app in System Settings > Privacy & Security (tools/README.md).
codesign/codesign=1
; notarization/notarization: 0 = not notarized (needs a paid Apple account).
notarization/notarization=0

[preset.2]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, docs/*, .github/*, tools/*.sh, tools/*/*, assets/placeholder/source/*"
export_path="build/linux/DungeonDudes.x86_64"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

; binary_format/architecture: "x86_64", the common Linux desktop. tools/build.sh --check runs it.
binary_format/architecture="x86_64"
; binary_format/embed_pck: false keeps the game data in DungeonDudes.pck next to the binary.
binary_format/embed_pck=false
